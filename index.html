<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiosk Quest - React Live Coding</title>
    <style>
      /* Minimal CSS - just enough to make it usable */
      /* You don't need to write any custom styles */

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: sans-serif;
        padding: 20px;
      }

      .container {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
      }

      .menu-item,
      .cart {
        border: 1px solid #ddd;
        padding: 15px;
      }

      button {
        padding: 8px 16px;
        margin: 5px;
        cursor: pointer;
      }

      ul {
        list-style: none;
      }

      li {
        padding: 5px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React and ReactDOM via CDN -->
    <script
      crossorigin

    ></script>

</html>
